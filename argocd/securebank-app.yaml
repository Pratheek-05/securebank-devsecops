apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securebank-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Pratheek-05/securebank-devsecops.git"
    targetRevision: main
    path: helm/securebank
  destination:
    server: https://kubernetes.default.svc
    namespace: securebank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
